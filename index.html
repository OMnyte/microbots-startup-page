<html lang="it">
<head>
  <meta charset="utf-8">

  <title>MICROBOTS / Swarmfield - Private</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --paper: #fffefa;
      --ink: #161616;
      --muted: #6b655d;
      --line: #d9d4ca;
      --accent: #116a5c;
      --gold: #9d6a24;
      --danger: #9b2d20;
      --shadow: 0 18px 48px rgba(32, 29, 25, 0.11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(17, 106, 92, 0.10), rgba(157, 106, 36, 0.05) 44%, transparent),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 18px;
    }
    main {
      width: min(100%, 440px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .kicker {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 27px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    label {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 12px;
      font-size: 16px;
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 750;
      font-size: 15px;
    }
    .status {
      min-height: 20px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .error { color: var(--danger); }
  </style>
</head>

    const form = document.querySelector("#unlockForm");
    const input = document.querySelector("#password");
    const status = document.querySelector("#status");
    const button = document.querySelector("#unlockBtn");

    function fromB64(value) {
      const raw = atob(value);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
      return bytes;
    }

    async function unlock(password) {
      const encoder = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromB64(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256",
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const tag = fromB64(payload.tag);
      const encrypted = fromB64(payload.ciphertext);
      const combined = new Uint8Array(encrypted.length + tag.length);
      combined.set(encrypted);
      combined.set(tag, encrypted.length);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromB64(payload.iv), tagLength: 128 },
        key,
        combined,
      );
      return new TextDecoder().decode(decrypted);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.className = "status";
      status.textContent = "Apertura documento...";
      button.disabled = true;
      try {
        const html = await unlock(input.value);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.className = "status error";
        status.textContent = "Password errata o documento non leggibile.";
        button.disabled = false;
      }
    });
  </script>
</body>
