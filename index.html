    const form = document.querySelector("#unlockForm");
    const input = document.querySelector("#password");
    const status = document.querySelector("#status");
    const button = document.querySelector("#unlockBtn");

    function fromB64(value) {
      const raw = atob(value);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
      return bytes;
    }

    async function unlock(password) {
      const encoder = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"],
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromB64(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256",
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"],
      );
      const tag = fromB64(payload.tag);
      const encrypted = fromB64(payload.ciphertext);
      const combined = new Uint8Array(encrypted.length + tag.length);
      combined.set(encrypted);
      combined.set(tag, encrypted.length);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromB64(payload.iv), tagLength: 128 },
        key,
        combined,
      );
      return new TextDecoder().decode(decrypted);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.className = "status";
      status.textContent = "Decrypting...";
      button.disabled = true;
      try {
        const html = await unlock(input.value);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.className = "status error";
        status.textContent = "Wrong password or corrupted document.";
        button.disabled = false;
      }
    });
  </script>
